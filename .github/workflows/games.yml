# Updates assets/data/games.json (Genshin Impact + Honkai: Star Rail stats from Enka.Network)
# every 6 hours, and whenever config.js changes. Wuthering Waves has no public API, so its
# stats are typed into config.js by hand.
name: Update game stats

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/js/config.js
      - scripts/fetch-games.mjs

permissions:
  contents: write
  pages: write

concurrency:
  group: game-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats
        run: node scripts/fetch-games.mjs

      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- assets/data/games.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/games.json
          git commit -m "Update game stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own. The page also
      # reads games.json from raw.githubusercontent.com, so this step is best-effort.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
