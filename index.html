<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sửa tiêu đề/mô tả ở đây để link preview (Discord, Facebook...) hiển thị đúng -->
  <title>Nguyen Anh Quan</title>
  <meta name="description" content="Trang cá nhân của tôi: mạng xã hội, nhạc và hoạt động trực tiếp." />
  <meta property="og:title" content="Nguyen Anh Quan" />
  <meta property="og:url" content="https://nguyenanhquan.tech/" />
  <meta property="og:description" content="Trang cá nhân của tôi: mạng xã hội, nhạc và hoạt động trực tiếp." />
  <meta property="og:type" content="profile" />
  <meta name="theme-color" content="#0b0b12" />
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" referrerpolicy="no-referrer" />
  <!-- Tăng số ?v= mỗi khi sửa CSS/JS để người xem nhận bản mới ngay, không phải đợi cache 10 phút -->
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
</head>
<body>
  <!-- Nền: video / ảnh / gradient + lớp hạt -->
  <div class="bg" aria-hidden="true">
    <div class="bg-aurora"></div>
    <img class="bg-media" id="bg-image" alt="" hidden />
    <video class="bg-media" id="bg-video" muted loop playsinline preload="auto" hidden></video>
    <div class="bg-overlay"></div>
    <canvas id="particles"></canvas>
  </div>

  <!-- Màn hình "nhấn để vào" (cần để trình duyệt cho phép phát nhạc) -->
  <button class="enter" id="enter" type="button" hidden>
    <span class="enter-text" id="enter-text">nhấn để vào</span>
  </button>

  <main class="stage" id="stage">
    <article class="card" id="card">
      <header class="profile">
        <div class="avatar-wrap">
          <img class="avatar" id="avatar" alt="Ảnh đại diện" />
          <img class="avatar-deco" id="avatar-deco" alt="" hidden />
          <span class="status-dot" id="status-dot" hidden></span>
        </div>

        <h1 class="name" id="name"></h1>
        <div class="badges" id="badges"></div>
        <p class="meta" id="meta"></p>
        <p class="bio"><span id="bio-text"></span><span class="caret" aria-hidden="true">|</span></p>
      </header>

      <nav class="socials" id="socials" aria-label="Mạng xã hội"></nav>

      <section class="lover" id="lover" aria-label="Người yêu"></section>

      <!-- Trình phát playlist có đĩa xoay. Danh sách bài nằm trong assets/js/config.js -->
      <section class="music" id="music" aria-label="Trình phát nhạc" hidden>
        <div class="music-main">
          <div class="turntable" aria-hidden="true">
            <div class="disc">
              <div class="disc-label">
                <img id="disc-cover" alt="" hidden />
                <i class="fa-solid fa-music" id="disc-icon"></i>
              </div>
            </div>
            <div class="disc-sheen"></div>
            <div class="tonearm"></div>
          </div>

          <div class="music-body">
            <div class="music-label">
              <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
              <span id="music-state">Tạm dừng</span>
              <span class="music-count" id="music-count"></span>
            </div>
            <div class="music-title" id="music-title"></div>
            <div class="music-artist" id="music-artist"></div>
            <input class="range seek" id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Tua bài hát" />
            <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
          </div>
        </div>

        <div class="music-controls">
          <button class="mbtn" id="btn-list" type="button" aria-label="Danh sách phát" data-tip="Danh sách phát" aria-expanded="false" aria-controls="playlist">
            <i class="fa-solid fa-list-ul" aria-hidden="true"></i>
          </button>
          <div class="transport">
            <button class="mbtn" id="btn-shuffle" type="button" aria-label="Trộn bài" data-tip="Trộn bài" aria-pressed="false">
              <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
            </button>
            <button class="mbtn" id="btn-prev" type="button" aria-label="Bài trước" data-tip="Bài trước">
              <i class="fa-solid fa-backward-step" aria-hidden="true"></i>
            </button>
            <button class="mbtn mbtn-play" id="btn-play" type="button" aria-label="Phát">
              <i class="fa-solid fa-play" id="play-icon" aria-hidden="true"></i>
            </button>
            <button class="mbtn" id="btn-next" type="button" aria-label="Bài tiếp" data-tip="Bài tiếp">
              <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
            </button>
            <button class="mbtn" id="btn-repeat" type="button" aria-label="Lặp lại">
              <i class="fa-solid fa-repeat" aria-hidden="true"></i><span class="repeat-one" aria-hidden="true">1</span>
            </button>
          </div>
          <div class="vol">
            <button class="mbtn" id="btn-mute" type="button" aria-label="Tắt tiếng" data-tip="Tắt tiếng">
              <i class="fa-solid fa-volume-high" id="vol-icon" aria-hidden="true"></i>
            </button>
            <input class="range vol-range" id="vol" type="range" min="0" max="1" step="0.01" aria-label="Âm lượng" />
          </div>
        </div>

        <ol class="playlist" id="playlist" hidden></ol>
        <audio id="audio" preload="metadata"></audio>
      </section>

      <section class="activity" id="activity" aria-label="Hoạt động"></section>

      <section class="links" id="links" aria-label="Liên kết"></section>
    </article>

    <footer class="footer" id="footer"></footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/main.js?v=2"></script>
</body>
</html>
