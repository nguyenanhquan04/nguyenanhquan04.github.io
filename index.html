<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sửa tiêu đề/mô tả ở đây để link preview (Discord, Facebook...) hiển thị đúng -->
  <title>Nguyen Anh Quan</title>
  <meta name="description" content="Trang cá nhân của tôi: mạng xã hội, nhạc và hoạt động trực tiếp." />
  <meta property="og:title" content="Nguyen Anh Quan" />
  <meta property="og:url" content="https://nguyenanhquan.tech/" />
  <meta property="og:description" content="Trang cá nhân của tôi: mạng xã hội, nhạc và hoạt động trực tiếp." />
  <meta property="og:type" content="profile" />
  <meta name="theme-color" content="#0b0920" />
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- VT323 + Tiny5: phông pixel có đủ dấu tiếng Việt. Quicksand + Dancing Script: trang người yêu -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Tiny5&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <!-- Icon pixel (pixelarticons, MIT) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixelarticons@1.8.2/fonts/pixelart-icons-font.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" referrerpolicy="no-referrer" />
  <!-- Tăng số ?v= mỗi khi sửa CSS/JS để người xem nhận bản mới ngay, không phải đợi cache 10 phút -->
  <link rel="stylesheet" href="assets/css/style.css?v=15" />
</head>
<body>
  <!-- Nền: bầu trời đêm kiểu pixel (dải màu, trăng, đồi) + canvas sao & sao băng; hoặc video / ảnh -->
  <div class="bg" aria-hidden="true">
    <div class="bg-sky"></div>
    <img class="bg-media" id="bg-image" alt="" hidden />
    <video class="bg-media" id="bg-video" muted loop playsinline preload="auto" hidden></video>
    <div class="bg-overlay"></div>
    <canvas id="particles"></canvas>
    <svg class="bg-moon" viewBox="0 0 20 20" shape-rendering="crispEdges"><rect x="9" y="1" width="1" height="1" fill="#f2c96b"/><rect x="6" y="2" width="3" height="1" fill="#f2c96b"/><rect x="4" y="3" width="2" height="1" fill="#f2c96b"/><rect x="7" y="3" width="1" height="1" fill="#f2c96b"/><rect x="3" y="4" width="2" height="1" fill="#f2c96b"/><rect x="3" y="5" width="1" height="1" fill="#f2c96b"/><rect x="6" y="5" width="1" height="1" fill="#f2c96b"/><rect x="2" y="6" width="1" height="1" fill="#f2c96b"/><rect x="6" y="6" width="1" height="1" fill="#f2c96b"/><rect x="2" y="7" width="1" height="1" fill="#f2c96b"/><rect x="6" y="7" width="1" height="1" fill="#f2c96b"/><rect x="2" y="8" width="1" height="1" fill="#f2c96b"/><rect x="6" y="8" width="1" height="1" fill="#f2c96b"/><rect x="1" y="9" width="2" height="1" fill="#f2c96b"/><rect x="1" y="10" width="2" height="1" fill="#f2c96b"/><rect x="2" y="11" width="1" height="1" fill="#f2c96b"/><rect x="2" y="12" width="1" height="1" fill="#f2c96b"/><rect x="8" y="12" width="1" height="1" fill="#f2c96b"/><rect x="2" y="13" width="1" height="1" fill="#f2c96b"/><rect x="9" y="13" width="1" height="1" fill="#f2c96b"/><rect x="3" y="14" width="1" height="1" fill="#f2c96b"/><rect x="11" y="14" width="1" height="1" fill="#f2c96b"/><rect x="16" y="14" width="1" height="1" fill="#f2c96b"/><rect x="3" y="15" width="2" height="1" fill="#f2c96b"/><rect x="15" y="15" width="2" height="1" fill="#f2c96b"/><rect x="4" y="16" width="2" height="1" fill="#f2c96b"/><rect x="14" y="16" width="2" height="1" fill="#f2c96b"/><rect x="6" y="17" width="8" height="1" fill="#f2c96b"/><rect x="9" y="18" width="2" height="1" fill="#f2c96b"/><rect x="6" y="3" width="1" height="1" fill="#fff1b8"/><rect x="5" y="4" width="2" height="1" fill="#fff1b8"/><rect x="4" y="5" width="2" height="1" fill="#fff1b8"/><rect x="3" y="6" width="3" height="1" fill="#fff1b8"/><rect x="3" y="7" width="3" height="1" fill="#fff1b8"/><rect x="3" y="8" width="3" height="1" fill="#fff1b8"/><rect x="3" y="9" width="4" height="1" fill="#fff1b8"/><rect x="3" y="10" width="1" height="1" fill="#fff1b8"/><rect x="6" y="10" width="1" height="1" fill="#fff1b8"/><rect x="3" y="11" width="1" height="1" fill="#fff1b8"/><rect x="5" y="11" width="3" height="1" fill="#fff1b8"/><rect x="3" y="12" width="5" height="1" fill="#fff1b8"/><rect x="3" y="13" width="6" height="1" fill="#fff1b8"/><rect x="4" y="14" width="2" height="1" fill="#fff1b8"/><rect x="8" y="14" width="3" height="1" fill="#fff1b8"/><rect x="5" y="15" width="10" height="1" fill="#fff1b8"/><rect x="6" y="16" width="8" height="1" fill="#fff1b8"/><rect x="4" y="10" width="2" height="1" fill="#e7b95a"/><rect x="4" y="11" width="1" height="1" fill="#e7b95a"/><rect x="6" y="14" width="2" height="1" fill="#e7b95a"/></svg>
    <svg class="bg-hills" viewBox="0 0 320 56" preserveAspectRatio="xMidYMax slice" shape-rendering="crispEdges"><path d="M0 56V22H8V24H16V26H24V24H32V28H40V28H48V24H56V24H64V28H72V30H80V34H88V40H96V40H104V36H112V34H120V32H128V28H136V32H144V32H152V28H160V26H168V24H176V20H184V20H192V26H200V28H208V32H216V36H224V34H232V32H240V34H248V36H256V34H264V38H272V38H280V30H288V26H296V24H304V20H312V22H320V28H328V56Z" fill="#1c1550"/><path d="M0 56V46H6V46H12V44H18V44H24V46H30V48H36V48H42V46H48V44H54V44H60V40H66V36H72V34H78V36H84V38H90V38H96V38H102V40H108V42H114V40H120V38H126V40H132V42H138V44H144V44H150V46H156V50H162V50H168V48H174V46H180V44H186V44H192V40H198V38H204V40H210V42H216V42H222V40H228V38H234V38H240V38H246V34H252V34H258V38H264V42H270V44H276V44H282V46H288V48H294V48H300V44H306V44H312V46H318V46H324V56Z" fill="#0e0b2c"/></svg>
  </div>

  <!-- Hình pixel dùng chung: cuộn băng cassette -->
  <svg class="px-sprites" aria-hidden="true" focusable="false"><symbol id="px-reel" viewBox="0 0 12 12"><rect x="5" y="0" width="2" height="1" fill="#ece8ff"/><rect x="3" y="1" width="6" height="1" fill="#ece8ff"/><rect x="2" y="2" width="1" height="1" fill="#ece8ff"/><rect x="6" y="2" width="4" height="1" fill="#ece8ff"/><rect x="1" y="3" width="2" height="1" fill="#ece8ff"/><rect x="6" y="3" width="5" height="1" fill="#ece8ff"/><rect x="1" y="4" width="4" height="1" fill="#ece8ff"/><rect x="7" y="4" width="4" height="1" fill="#ece8ff"/><rect x="0" y="5" width="4" height="1" fill="#ece8ff"/><rect x="10" y="5" width="2" height="1" fill="#ece8ff"/><rect x="0" y="6" width="4" height="1" fill="#ece8ff"/><rect x="10" y="6" width="2" height="1" fill="#ece8ff"/><rect x="1" y="7" width="4" height="1" fill="#ece8ff"/><rect x="7" y="7" width="4" height="1" fill="#ece8ff"/><rect x="1" y="8" width="2" height="1" fill="#ece8ff"/><rect x="6" y="8" width="5" height="1" fill="#ece8ff"/><rect x="2" y="9" width="1" height="1" fill="#ece8ff"/><rect x="6" y="9" width="4" height="1" fill="#ece8ff"/><rect x="3" y="10" width="6" height="1" fill="#ece8ff"/><rect x="5" y="11" width="2" height="1" fill="#ece8ff"/><rect x="3" y="2" width="3" height="1" fill="#2b2366"/><rect x="3" y="3" width="3" height="1" fill="#2b2366"/><rect x="8" y="5" width="2" height="1" fill="#2b2366"/><rect x="8" y="6" width="2" height="1" fill="#2b2366"/><rect x="3" y="8" width="3" height="1" fill="#2b2366"/><rect x="3" y="9" width="3" height="1" fill="#2b2366"/><rect x="5" y="4" width="2" height="1" fill="#120f33"/><rect x="4" y="5" width="4" height="1" fill="#120f33"/><rect x="4" y="6" width="4" height="1" fill="#120f33"/><rect x="5" y="7" width="2" height="1" fill="#120f33"/></symbol></svg>

  <!-- Màn hình "nhấn để vào" (cần để trình duyệt cho phép phát nhạc) -->
  <button class="enter" id="enter" type="button" hidden>
    <span class="enter-logo">nguyenanhquan.tech</span>
    <span class="enter-cta"><i class="pixelart-icons-font-play" aria-hidden="true"></i><span id="enter-text">nhấn để vào</span></span>
  </button>

  <main class="stage" id="stage">
    <div class="px-col">
      <!-- Hồ sơ -->
      <section class="win win-profile" aria-labelledby="t-profile">
        <h2 class="win-title" id="t-profile"><i class="pixelart-icons-font-user" aria-hidden="true"></i> Người chơi 1</h2>
        <header class="profile">
          <div class="avatar-wrap">
            <span class="avatar-ring" aria-hidden="true"></span>
            <img class="avatar" id="avatar" alt="Ảnh đại diện" />
            <img class="avatar-deco" id="avatar-deco" alt="" hidden />
            <span class="status-dot" id="status-dot" hidden></span>
          </div>
          <!-- Custom status Discord, vẽ như bong bóng suy nghĩ bay lên từ avatar -->
          <p class="thought" id="thought" hidden><span class="sr-only">Đang nghĩ: </span><span id="thought-text"></span></p>
          <div class="profile-info">
            <h1 class="name" id="name"></h1>
            <p class="meta" id="meta"></p>
            <p class="presence" id="presence" hidden></p>
            <div class="badges" id="badges"></div>
          </div>
        </header>
        <p class="bio"><span id="bio-text"></span><span class="caret" aria-hidden="true"></span></p>
        <nav class="socials" id="socials" aria-label="Mạng xã hội"></nav>
        <section class="links" id="links" aria-label="Liên kết"></section>
      </section>

      <!-- Người yêu (bấm để mở trang riêng của cô ấy) -->
      <section class="lover" id="lover" aria-label="Người yêu"></section>

      <!-- Máy nghe nhạc cassette. Danh sách bài nằm trong assets/js/config.js (music.tracks) -->
      <section class="win win-music" id="music" aria-labelledby="t-music" hidden>
        <h2 class="win-title" id="t-music"><i class="pixelart-icons-font-music" aria-hidden="true"></i> Máy nghe nhạc</h2>
        <div class="cassette">
          <div class="cs-label">
            <span class="cs-side" aria-hidden="true">A</span>
            <div class="cs-text">
              <div class="cs-title" id="music-title"></div>
              <div class="cs-artist" id="music-artist"></div>
            </div>
            <span class="cs-cover" aria-hidden="true">
              <img id="disc-cover" alt="" hidden />
              <i class="pixelart-icons-font-music" id="disc-icon"></i>
            </span>
          </div>
          <div class="cs-window" aria-hidden="true">
            <span class="cs-spool cs-left"><span class="cs-tape"></span><svg class="cs-reel" viewBox="0 0 12 12"><use href="#px-reel" /></svg></span>
            <span class="cs-strip"></span>
            <span class="cs-spool cs-right"><span class="cs-tape"></span><svg class="cs-reel" viewBox="0 0 12 12"><use href="#px-reel" /></svg></span>
          </div>
          <div class="cs-foot" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <p class="cs-from">Đang phát từ <span id="music-playlist"></span></p>
        <span class="sr-only" id="music-state" aria-live="polite"></span>

        <input class="px-range seek" id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Tua bài hát" />
        <div class="px-times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>

        <div class="px-controls">
          <button class="pbtn" id="btn-shuffle" type="button" aria-label="Trộn bài" data-tip="Trộn bài" aria-pressed="false"><i class="pixelart-icons-font-shuffle" aria-hidden="true"></i></button>
          <button class="pbtn" id="btn-prev" type="button" aria-label="Bài trước" data-tip="Bài trước"><i class="pixelart-icons-font-prev" aria-hidden="true"></i></button>
          <button class="pbtn pbtn-play" id="btn-play" type="button" aria-label="Phát"><i class="pixelart-icons-font-play" id="play-icon" aria-hidden="true"></i></button>
          <button class="pbtn" id="btn-next" type="button" aria-label="Bài tiếp" data-tip="Bài tiếp"><i class="pixelart-icons-font-next" aria-hidden="true"></i></button>
          <button class="pbtn" id="btn-repeat" type="button" aria-label="Lặp lại"><i class="pixelart-icons-font-repeat" aria-hidden="true"></i><span class="repeat-one" aria-hidden="true">1</span></button>
        </div>
        <div class="px-vol">
          <button class="pbtn pbtn-sm" id="btn-mute" type="button" aria-label="Tắt tiếng" data-tip="Tắt tiếng"><i class="pixelart-icons-font-volume-3" id="vol-icon" aria-hidden="true"></i></button>
          <input class="px-range vol-range" id="vol" type="range" min="0" max="1" step="0.01" aria-label="Âm lượng" />
        </div>

        <div class="px-list-head"><span>Danh sách phát</span><span id="music-count"></span></div>
        <ol class="px-list" id="playlist"></ol>
        <audio id="audio" preload="metadata"></audio>
      </section>

      <!-- Game: WuWa · Genshin · HSR (cấu hình trong assets/js/config.js → games) -->
      <section class="win win-games" id="games" aria-labelledby="gm-title" hidden>
        <h2 class="win-title"><i class="pixelart-icons-font-gamepad" aria-hidden="true"></i> <span id="gm-title"></span></h2>
        <div class="gm-tabs" id="gm-tabs" role="tablist" aria-label="Chọn game"></div>
        <div class="gm-stage" id="gm-stage"></div>
      </section>

      <footer class="footer" id="footer"></footer>
    </div>

    <!-- PC: nút nhảy nhanh tới Người chơi 1 · Máy nghe nhạc · Game -->
    <nav class="quick-nav" id="quick-nav" aria-label="Nhảy nhanh" hidden></nav>

    <!-- Góc dưới bên trái: thông báo khi đang chơi game / mở app / nghe Spotify -->
    <div class="notices" id="notices" aria-live="polite"></div>
  </main>

  <!-- Trang riêng của người yêu (mở khi bấm thẻ "Người yêu tôi", hoặc vào thẳng /#love) -->
  <section class="love" id="love-view" aria-label="Trang người yêu" hidden>
    <div class="love-bg" aria-hidden="true">
      <div class="love-blob b1"></div>
      <div class="love-blob b2"></div>
      <div class="love-blob b3"></div>
      <div class="love-hearts" id="love-hearts"></div>
    </div>

    <div class="love-inner">
      <div class="love-top">
        <button class="love-back" id="love-back" type="button">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Quay lại
        </button>
      </div>

      <header class="love-hero">
        <div class="love-moon" aria-hidden="true">
          <span class="moon"></span>
          <i class="fa-solid fa-star sparkle s1"></i><i class="fa-solid fa-star sparkle s2"></i><i class="fa-regular fa-star sparkle s3"></i><i class="fa-solid fa-star sparkle s4"></i>
        </div>
        <div class="love-avatar-wrap">
          <img class="love-avatar" id="love-avatar" alt="Ảnh đại diện" />
          <img class="love-deco" id="love-deco" alt="" hidden />
          <span class="love-dot" id="love-dot" hidden></span>
        </div>
        <p class="love-kicker" id="love-kicker"></p>
        <h2 class="love-name" id="love-name"></h2>
        <p class="love-handle" id="love-handle"></p>
        <p class="love-status" id="love-status" hidden></p>
      </header>

      <section class="love-card love-couple" id="love-couple" aria-label="Hai đứa"></section>

      <!-- Nhạc riêng của trang này: thay nhạc chính khi trang mở, trả lại khi đóng -->
      <section class="love-card love-song" id="love-song" aria-label="Bài hát" hidden>
        <div class="ls-main">
          <div class="ls-disc" aria-hidden="true">
            <div class="ls-label">
              <img id="ls-cover" alt="" hidden />
              <i class="fa-solid fa-heart" id="ls-icon"></i>
            </div>
          </div>
          <div class="ls-body">
            <h3 class="love-card-title"><i class="fa-solid fa-music" aria-hidden="true"></i> <span id="ls-label"></span></h3>
            <div class="ls-title" id="ls-title"></div>
            <div class="ls-artist" id="ls-artist"></div>
          </div>
        </div>
        <input class="range ls-seek" id="ls-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Tua bài hát" />
        <div class="times"><span id="ls-cur">0:00</span><span id="ls-dur">0:00</span></div>
        <div class="ls-controls">
          <button class="ls-btn" id="ls-prev" type="button" aria-label="Bài trước" hidden><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
          <button class="ls-btn ls-play" id="ls-play" type="button" aria-label="Phát"><i class="fa-solid fa-play" id="ls-play-icon" aria-hidden="true"></i></button>
          <button class="ls-btn" id="ls-next" type="button" aria-label="Bài tiếp" hidden><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
        </div>
        <audio id="love-audio" preload="metadata"></audio>
      </section>
      <section class="love-card love-now" id="love-now" aria-label="Cô ấy đang làm gì" hidden></section>
      <section class="love-card love-letter" id="love-letter" aria-label="Lời nhắn" hidden></section>
      <section class="love-gallery" id="love-gallery" aria-label="Ảnh" hidden></section>

      <div class="love-actions">
        <a class="love-btn" id="love-discord" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-discord" aria-hidden="true"></i> Hồ sơ Discord
        </a>
      </div>
      <footer class="love-foot" id="love-foot"></footer>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js?v=15"></script>
  <script src="assets/js/main.js?v=15"></script>
</body>
</html>
